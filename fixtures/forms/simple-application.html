<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple application</title>
  </head>
  <body>
    <h1>Apply for Software Engineer</h1>
    <form id="application" action="/submitted" method="post">
      <fieldset>
        <legend>Personal information</legend>
        <label for="first-name">First name *</label>
        <input id="first-name" name="firstName" autocomplete="given-name" required />

        <label for="last-name">Last name *</label>
        <input id="last-name" name="lastName" autocomplete="family-name" required />

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" />

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" />
      </fieldset>

      <fieldset>
        <legend>Work authorization</legend>
        <p id="sponsor-q">Will you now or in the future require sponsorship?</p>
        <label><input type="radio" name="sponsorship" value="yes" /> Yes</label>
        <label><input type="radio" name="sponsorship" value="no" /> No</label>
      </fieldset>

      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select…</option>
        <option value="US">United States</option>
        <option value="IN">India</option>
        <option value="GB">United Kingdom</option>
      </select>

      <label><input type="checkbox" name="terms" /> I agree to the terms and conditions</label>

      <button type="submit">Submit application</button>
    </form>

    <iframe title="Embedded questions" src="./frame-questions.html"></iframe>
  </body>
</html>
